name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: my-business-brain/package-lock.json
      - name: Lint my-business-brain
        working-directory: my-business-brain
        run: npm run lint
      - name: Check Python syntax (antigravity)
        run: python -m py_compile agy_sample.py

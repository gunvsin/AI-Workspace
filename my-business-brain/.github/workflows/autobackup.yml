name: Autobackup

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 */4 * * *'

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: git config user.name "Bot" && git config user.email "bot@local"
      - run: git add -A && git commit -m "autobackup $(date -I)" || true
      - run: git push || true

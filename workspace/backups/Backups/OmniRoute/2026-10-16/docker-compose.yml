services:
  # 1. Native Ollama Engine Service
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_storage:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 3s
      retries: 5

  # 2. OmniRoute Mesh Orchestrator Service
  omniroute:
    image: diegosouzapw/omniroute:latest
    container_name: omniroute
    restart: unless-stopped
    ports:
      - "20128:20128"
    depends_on:
      ollama:
        condition: service_healthy
    volumes:
      - ./data:/app/data
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - PROVIDERS_OLLAMA_BASE_URL=http://ollama:11434
      - OLLAMA_ENABLED=true
      - PROVIDERS_OLLAMA_ENABLED=true
      - CUSTOM_PROVIDERS_ENABLED=true
      - AUTO_DISCOVER_PROVIDERS=true
      - STORAGE_ENCRYPTION_ENABLED=false
      - DISABLE_STORAGE_ENCRYPTION=true

  # 3. FreeLLMAPI Gateway
  freellmapi:
    image: ghcr.io/tashfeenahmed/freellmapi:latest
    container_name: freellmapi
    restart: unless-stopped
    ports:
      - "3001:3001"

  # 4. 9router Proxy Mesh
  9router:
    image: decolua/9router:latest
    container_name: 9router
    restart: unless-stopped
    ports:
      - "20129:20128"
    depends_on:
      - omniroute

volumes:
  ollama_storage:
    external: true
